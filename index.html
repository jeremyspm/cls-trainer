<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#161719"/>
<meta name="robots" content="noindex, nofollow"/>
<title>CLS Practical Trainer</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<script>/* paint the right theme before first render — no flash */
try{document.documentElement.setAttribute('data-theme',localStorage.getItem('hub.theme')||'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="iconbtn" id="backBtn" hidden aria-label="Back">←</button>
    <div class="ttl">
      <h1 id="title">CLS Practical Trainer</h1>
      <div class="sub" id="subtitle">Vital signs · Medication administration</div>
    </div>
    <button class="iconbtn" id="helpBtn" aria-label="What is this?">?</button>
    <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark">◐</button>
  </header>
  <main id="view" tabindex="-1"></main>
</div>
<div class="sheet-scrim" id="sheetScrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="js/data.js"></script>
<script src="js/rnq-data.js"></script>
<script src="js/voice.js"></script>
<script src="js/bp.js"></script>
<script src="js/chart-vs.js"></script>
<script src="js/chart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
