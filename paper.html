<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#161719"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Real Chart Practice · CLS Trainer</title>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<script>/* paint the right theme before first render — no flash */
try{document.documentElement.setAttribute('data-theme',localStorage.getItem('hub.theme')||'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<link rel="stylesheet" href="css/app.css"/>
<style>
/* the pen is the same on both themes: it writes on the (always white) paper chart */
:root{--pen:#1638b5}
.printonly{display:none}
a.btn{text-decoration:none;color:var(--tx)}
.paperbox{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:#fff;line-height:0}
.paperbox img{display:block;width:100%;height:auto}
.paperbox .ink{position:absolute;inset:0;width:100%;height:100%}
.ink .pen{fill:none;stroke:var(--pen);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ink .dot{stroke-dasharray:1.4 2.6;stroke-width:1.4}
.ink text{fill:var(--pen);font-family:"Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive;font-weight:600}
.ink .tot{font-weight:800}
a.zoom{display:block}
.rules{margin:10px 0}
.rules summary{cursor:pointer;padding:6px 0}
.rulelist{margin:4px 0 0;padding-left:20px;font-size:14.5px}
.rulelist li{margin:4px 0}
.srcnote{display:inline-block;font-size:11.5px;color:var(--tx3);margin-left:2px}
table.obs{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13.5px;font-variant-numeric:tabular-nums;margin:6px 0 4px}
table.obs th,table.obs td{border:1px solid var(--line2);padding:5px 2px;text-align:center;overflow:hidden}
table.obs th{background:var(--card2);font-size:12px;color:var(--tx2);font-weight:600}
table.obs th:nth-child(6),table.obs td:nth-child(6){width:22%}
table.obs tr.newdate td{background:var(--acc-soft);color:var(--acc-tx);font-weight:600;font-size:12.5px;text-align:left;padding-left:8px}
.answers{margin-top:8px}
@media screen{.answers.collapsed{display:none}}
.card.ans{padding:12px 14px}
.anshd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ewsb{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--card2)}
.ewsb.z-t1{background:var(--z-y)} .ewsb.z-t2{background:var(--z-o)} .ewsb.z-t3{background:var(--z-p)} .ewsb.z-t4{background:var(--z-b)}
.anslist{list-style:none;margin:8px 0;padding:0;font-size:14px}
.anslist li{display:flex;flex-wrap:wrap;gap:2px 8px;padding:4px 0;border-top:1px solid var(--line)}
.anslist li b{flex:0 0 104px}
.anslist li span{flex:1 1 140px;min-width:0}
.anslist li i{font-style:normal;color:var(--tx2);font-size:12.5px;white-space:nowrap}
img.panel{display:block;width:100%;max-width:420px;height:auto;border-radius:10px;border:1px solid var(--line2);background:#fff}

@media print{
  @page{size:A4 portrait;margin:8mm}
  html,html[data-theme]{--bg:#fff;--card:#fff;--card2:#f1f1f1;--tx:#000;--tx2:#333;--tx3:#666;--line:#bbb;--line2:#999;--acc-soft:#e8e8f6;--acc-tx:#222;
    --z-y:#fff3b0;--z-o:#fbd9b4;--z-p:#f6cfd9;--z-b:#d3e1f5}
  body{background:#fff;color:#000;padding:0;font-size:12px}
  .wrap{max-width:none;padding:0}
  .top,.noprint{display:none!important}
  .printonly{display:block}
  h2{font-size:15px;margin:0 0 6px}
  h3{font-size:13px;margin:10px 0 3px}
  .small{font-size:11px}
  .rulelist{font-size:11.5px}
  .rulelist li{margin:2px 0}
  .rules summary{list-style:none;padding:0 0 2px}
  table.obs{font-size:12px}
  table.obs th,table.obs td{padding:3px 2px}
  .pg2,.pg3,.pg4,.pg5{break-before:page}
  .paperbox{border-radius:0;border:none}
  .card{break-inside:avoid;margin:5px 0;padding:6px 10px;border-radius:6px}
  .anslist{font-size:11px;margin:4px 0}
  .anslist li{padding:2px 0}
  .card.ans p{margin:2px 0}
  .ansgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 4mm}
  .ansgrid .card{margin:2mm 0}
  .anslist li b{flex:0 0 78px}
  h3{break-after:avoid}
  img.panel{max-width:118mm;border:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="iconbtn" href="./#chart/vs" aria-label="Back to Chart it" style="text-decoration:none;color:inherit">←</a>
    <div class="ttl">
      <h1>Real chart practice</h1>
      <div class="sub">The Adult Vital Signs Chart · Janine’s slide 34</div>
    </div>
    <button class="iconbtn" id="helpBtn" aria-label="What is this?">?</button>
    <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark">◐</button>
  </header>
  <main id="paper"></main>
</div>
<script src="js/data.js"></script>
<script src="js/chart-vs.js"></script>
<script src="js/paper.js"></script>
<script>window.addEventListener('beforeprint',()=>document.querySelectorAll('#paper details').forEach(d=>d.open=true));</script>
</body>
</html>
